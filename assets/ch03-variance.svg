<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Score correction preserves Gaussian variance</title><desc id="desc">Target variance and corrected exact SDE coincide. An uncorrected SDE has final variance four plus pi. A 32-step corrected recurrence retains a smaller numerical bias.</desc><rect width="800" height="440" fill="#111827"/><g fill="#e5e7eb" font-family="Georgia,serif" font-size="16"><text x="70" y="27">Same Gaussian path, diffusion amplitude σ = 1</text><text x="70" y="57" fill="#fbbf24">Target / exact corrected SDE</text><text x="430" y="57" fill="#fb7185">Noise without correction</text><text x="70" y="81" fill="#7dd3fc">Corrected EM, 32 steps</text><text x="405" y="426" text-anchor="middle">Generation time t</text><text x="14" y="91">Variance</text><text x="70" y="390" text-anchor="middle">0</text><text x="235.0" y="390" text-anchor="middle">0.25</text><text x="400.0" y="390" text-anchor="middle">0.5</text><text x="565.0" y="390" text-anchor="middle">0.75</text><text x="730" y="390" text-anchor="middle">1</text><text x="55" y="370.0" text-anchor="end">0</text><text x="55" y="302.5" text-anchor="end">2</text><text x="55" y="235.0" text-anchor="end">4</text><text x="55" y="167.5" text-anchor="end">6</text><text x="55" y="100.0" text-anchor="end">8</text></g><path d="M70,95V365H730" stroke="#94a3b8" fill="none"/><polyline points="70.000,331.250 71.650,331.418 73.300,331.583 74.950,331.747 76.600,331.908 78.250,332.067 79.900,332.225 81.550,332.380 83.200,332.533 84.850,332.683 86.500,332.832 88.150,332.979 89.800,333.123 91.450,333.266 93.100,333.406 94.750,333.544 96.400,333.680 98.050,333.814 99.700,333.946 101.350,334.076 103.000,334.203 104.650,334.329 106.300,334.452 107.950,334.573 109.600,334.692 111.250,334.810 112.900,334.925 114.550,335.037 116.200,335.148 117.850,335.257 119.500,335.363 121.150,335.468 122.800,335.570 124.450,335.670 126.100,335.768 127.750,335.864 129.400,3